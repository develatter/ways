name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `npm test` builds once through its pretest hook.
      - run: npm run check
      # The wiki in docs/wiki: links, frontmatter, pages stale against their sources, examples, coverage.
      - run: node dist/cli.js wiki check

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@develatter'
      - run: npm ci
      - run: npm run build
      - name: Publish if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          # A pre-release (0.3.0-dev.0) goes to the `next` tag, never to `latest`.
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          if npm view "@develatter/ways@${version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@develatter/ways@${version} already exists; skipping publish."
          else
            npm publish --tag "$tag" --registry=https://npm.pkg.github.com
          fi
